name: Release the extension

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Typecheck and test
        run: bun run typecheck && bun run test

      - name: Check the tag matches the version
        run: |
          VERSION=$(bun -p "require('./package.json').version")
          test "v$VERSION" = "$GITHUB_REF_NAME"

      - name: Build the extension
        run: bun run build

      - name: Package the extension
        run: bunx @vscode/vsce package --no-dependencies -o "lusia-$GITHUB_REF_NAME.vsix"

      - name: Create the GitHub release
        run: gh release create "$GITHUB_REF_NAME" "lusia-$GITHUB_REF_NAME.vsix" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish to the VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: bunx @vscode/vsce publish --no-dependencies --packagePath "lusia-$GITHUB_REF_NAME.vsix"

      - name: Note when the Marketplace step is skipped
        if: env.VSCE_PAT == ''
        run: echo "VSCE_PAT is not set, so the Marketplace publish was skipped. The GitHub release has the .vsix."
