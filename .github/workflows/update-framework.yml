name: Update lusiajs

on:
  schedule:
    - cron: "43 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-lusiajs
  cancel-in-progress: false

env:
  BRANCH: chore/update-lusiajs

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Read the locked lusiajs version
        id: before
        run: |
          version=$(bun pm ls | grep -E '── lusiajs@' | head -n 1 | cut -d@ -f2)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Update lusiajs
        run: bun update lusiajs --latest

      - name: Read the new lusiajs version
        id: after
        run: |
          version=$(bun pm ls | grep -E '── lusiajs@' | head -n 1 | cut -d@ -f2)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Stop when lusiajs is unchanged
        id: check
        env:
          BEFORE: ${{ steps.before.outputs.version }}
          AFTER: ${{ steps.after.outputs.version }}
        run: |
          if [ "$BEFORE" = "$AFTER" ]; then
            echo "lusiajs is up to date: $AFTER"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "lusiajs changed: $BEFORE -> $AFTER"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Typecheck
        id: typecheck
        if: steps.check.outputs.changed == 'true'
        continue-on-error: true
        run: bun run typecheck

      - name: Test
        id: test
        if: steps.check.outputs.changed == 'true'
        continue-on-error: true
        run: bun test

      - name: Build
        id: build
        if: steps.check.outputs.changed == 'true'
        continue-on-error: true
        run: bun run build

      - name: Commit and push the update
        if: steps.check.outputs.changed == 'true'
        env:
          AFTER: ${{ steps.after.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add bun.lock package.json
          git commit -m "chore: update lusiajs to $AFTER"
          git fetch origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH" || true
          git push --force-with-lease origin "HEAD:refs/heads/$BRANCH"

      - name: Open or update the pull request
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ steps.before.outputs.version }}
          AFTER: ${{ steps.after.outputs.version }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          TEST: ${{ steps.test.outcome }}
          BUILD: ${{ steps.build.outcome }}
        run: |
          title="chore: update lusiajs to $AFTER"
          body_file="$RUNNER_TEMP/pr-body.md"

          result_word() {
            if [ "$1" = success ]; then echo passed; else echo failed; fi
          }

          if [ "$TYPECHECK" = success ] && [ "$TEST" = success ] && [ "$BUILD" = success ]; then
            draft=false
            note=""
          else
            draft=true
            note="One or more checks failed. The lusiajs change may break the extension, so this PR is a draft. Fix the code before review."
          fi

          cat > "$body_file" <<EOF
          ## Summary

          lusiajs moved from $BEFORE to $AFTER.

          | Check | Result |
          | ----- | ------ |
          | Typecheck | $(result_word "$TYPECHECK") |
          | Tests | $(result_word "$TEST") |
          | Build | $(result_word "$BUILD") |

          $note

          To publish: bump the extension patch version in package.json and push a tag, see CLAUDE.md rule 5a.
          EOF

          existing=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')

          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "$title" --body-file "$body_file"
            if [ "$draft" = true ]; then
              gh pr ready --undo "$existing" || true
            else
              gh pr ready "$existing" || true
            fi
          elif [ "$draft" = true ]; then
            gh pr create --draft --base main --head "$BRANCH" --title "$title" --body-file "$body_file"
          else
            gh pr create --base main --head "$BRANCH" --title "$title" --body-file "$body_file"
          fi
